spring:
  application:
    name: usuario
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usuario}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD:ADMIN}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  error:
    include-message: always
